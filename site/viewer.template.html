<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} | CHaser 教材スライド</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
{{FONT_LINKS}}
{{STYLES}}
</head>
<body class="viewer">
<main class="stage" id="stage" aria-label="{{TITLE}}">
  <div class="canvas" id="canvas">
{{SLIDES}}
  </div>
</main>

<div class="overview" id="overview" hidden aria-label="スライド一覧"></div>

<aside class="notes" id="notes" hidden aria-live="polite">
  <p class="notes__label">ノート</p>
  <p class="notes__text" id="notes-text"></p>
</aside>

<nav class="toolbar" id="toolbar" aria-label="スライド操作">
  {{SITE_LINKS}}
  <span class="toolbar__title"><span class="toolbar__step">{{STEP}}</span>{{TITLE}}</span>
  <span class="toolbar__spacer"></span>
  {{PREV_LINK}}
  <button class="toolbar__btn" type="button" data-action="prev" aria-label="前のスライド">‹</button>
  <span class="toolbar__counter" id="counter">1 / 1</span>
  <button class="toolbar__btn" type="button" data-action="next" aria-label="次のスライド">›</button>
  {{NEXT_LINK}}
  <button class="toolbar__btn" type="button" data-action="overview" title="一覧表示（O）">一覧</button>
  <button class="toolbar__btn" type="button" data-action="notes" title="ノート（N）">ノート</button>
  <button class="toolbar__btn" type="button" data-action="fullscreen" title="全画面（F）">全画面</button>
  {{DOWNLOADS}}
</nav>

{{SCRIPTS}}
</body>
</html>
